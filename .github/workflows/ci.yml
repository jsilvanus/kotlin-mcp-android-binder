name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # binder-core carries protocol, limits, admission and lifecycle logic; it runs against the real SDK.
      - run: ./gradlew :binder-core:test --no-daemon
      # Fails if the public Kotlin API changed without updating the committed dump.
      - run: ./gradlew apiCheck --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # Compiles the AIDL, library and both sample apps. Cross-app behaviour is not tested here yet.
      - run: ./gradlew :binder-android:testDebugUnitTest :binder-android:assembleDebug :samples:provider-app:assembleDebug :samples:client-app:assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

  # Phone-installable test builds, kept as a workflow artifact (visible only to people with access to
  # the repository). Both sample apps come from this one job, so they share a debug signing key, which
  # the sample provider's caller policy needs.
  debug-apks:
    needs: [core, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :samples:provider-app:assembleDebug :samples:client-app:assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
      - name: Collect APKs
        run: |
          mkdir -p apks
          cp samples/provider-app/build/outputs/apk/debug/*.apk apks/binder-provider-debug.apk
          cp samples/client-app/build/outputs/apk/debug/*.apk apks/binder-client-debug.apk
          ls -l apks
      - uses: actions/upload-artifact@v4
        with:
          name: binder-sample-debug-apks
          path: apks/*.apk
          retention-days: 14

  # Cross-app behaviour on real Android images: low and mid API levels (the local emulator is API 36).
  device:
    needs: [core, android]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          script: ./gradlew :samples:provider-app:installDebug :samples:client-app:connectedDebugAndroidTest --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

  # Pre-release artifacts: the two libraries as a local Maven repository.
  publish-local:
    needs: [core, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :binder-core:publishToMavenLocal :binder-android:publishToMavenLocal --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: binder-maven-local
          path: ~/.m2/repository/fi/italeino/mcp
          retention-days: 14
